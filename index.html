<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            align-items: flex-start;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .input-card {
            flex: 1;
            min-width: 350px;
        }

        .results-card {
            flex: 1;
            min-width: 350px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .input-card,
            .results-card {
                min-width: 100%;
            }
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .help-text {
            display: block;
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            font-weight: 400;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .results-card {
            display: none;
        }

        .results-card.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            transition: transform 0.2s;
        }

        .result-row:hover {
            transform: translateX(5px);
        }

        .result-row.total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .result-row.weekdays {
            background: #e3f2fd;
            color: #1976d2;
        }

        .result-row.weekend {
            background: #fce4ec;
            color: #c2185b;
        }

        .result-label {
            font-weight: 600;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card input-card">
            <h1>Date Difference Calculator</h1>

            <div class="input-group">
                <label for="startDate">Start Date</label>
                <input type="text" id="startDate" placeholder="dd-mmm-yyyy" required autofocus>
                <span class="help-text">Format: dd-mmm-yyyy (e.g., 07-Dec-2025)</span>
            </div>

            <div class="input-group">
                <label for="endDate">End Date</label>
                <input type="text" id="endDate" placeholder="dd-mmm-yyyy" required>
                <span class="help-text">Format: dd-mmm-yyyy (e.g., 31-Dec-2025)</span>
            </div>

            <button class="button" onclick="calculateDifference()">Calculate Difference</button>

            <div class="error" id="error"></div>
        </div>

        <div class="card results-card" id="results">
            <h2>Results</h2>
            <div class="result-row total">
                <span class="result-label">Total Days</span>
                <span class="result-value" id="totalDays">0</span>
            </div>
            <div class="result-row weekdays">
                <span class="result-label">Weekdays (Mon-Fri)</span>
                <span class="result-value" id="weekdays">0</span>
            </div>
            <div class="result-row weekend">
                <span class="result-label">Weekend (Sat-Sun)</span>
                <span class="result-value" id="weekend">0</span>
            </div>
        </div>
    </div>

    <script>
        function parseDate(dateStr) {
            // Remove extra spaces
            dateStr = dateStr.trim();

            // Month abbreviations
            const months = {
                'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
                'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
            };

            // Try parsing dd-mmm-yyyy format (e.g., 07-Dec-2025)
            const ddMmmYyyyMatch = dateStr.match(/^(\d{1,2})-([a-zA-Z]{3})-(\d{4})$/);
            if (ddMmmYyyyMatch) {
                const day = parseInt(ddMmmYyyyMatch[1]);
                const monthStr = ddMmmYyyyMatch[2].toLowerCase();
                const year = parseInt(ddMmmYyyyMatch[3]);

                if (months.hasOwnProperty(monthStr)) {
                    return new Date(year, months[monthStr], day);
                }
            }

            // Try parsing YYYY-MM-DD format
            const isoMatch = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (isoMatch) {
                return new Date(isoMatch[1], parseInt(isoMatch[2]) - 1, isoMatch[3]);
            }

            // Try parsing MM/DD/YYYY or M/D/YYYY format
            const usMatch = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (usMatch) {
                return new Date(usMatch[3], parseInt(usMatch[1]) - 1, usMatch[2]);
            }

            // Try parsing DD/MM/YYYY or D/M/YYYY format
            const ukMatch = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (ukMatch && parseInt(ukMatch[1]) > 12) {
                return new Date(ukMatch[3], parseInt(ukMatch[2]) - 1, ukMatch[1]);
            }

            return null;
        }

        function calculateDifference() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            // Reset error
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            // Validate inputs
            if (!startDateInput || !endDateInput) {
                errorDiv.textContent = 'Please enter both dates';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            const startDate = parseDate(startDateInput);
            const endDate = parseDate(endDateInput);

            // Validate date parsing
            if (!startDate || isNaN(startDate.getTime())) {
                errorDiv.textContent = 'Invalid start date. Use format dd-mmm-yyyy (e.g., 07-Dec-2025)';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            if (!endDate || isNaN(endDate.getTime())) {
                errorDiv.textContent = 'Invalid end date. Use format dd-mmm-yyyy (e.g., 31-Dec-2025)';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            // Validate date order
            if (endDate < startDate) {
                errorDiv.textContent = 'End date must be after start date';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            // Calculate differences
            let totalDays = 0;
            let weekdays = 0;
            let weekend = 0;

            // Iterate through each day
            const currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                totalDays++;
                const dayOfWeek = currentDate.getDay();

                // 0 = Sunday, 6 = Saturday
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    weekend++;
                } else {
                    weekdays++;
                }

                // Move to next day
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Display results
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('weekdays').textContent = weekdays;
            document.getElementById('weekend').textContent = weekend;
            resultsDiv.classList.add('show');
        }

        // Set today's date as default for start date
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(today.getDate()).padStart(2, '0');
            const month = monthNames[today.getMonth()];
            const year = today.getFullYear();
            document.getElementById('startDate').value = `${day}-${month}-${year}`;
        });

        // Allow Enter key to trigger calculation
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateDifference();
            }
        });
    </script>
</body>
</html>
