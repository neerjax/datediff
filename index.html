<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateDiff - Your friendly date for all your date-diff needs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 18px;
            font-weight: 600;
        }

        .header-brand {
            color: #333;
        }

        .header-app {
            color: #10b981;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 80px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .main-title {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .title-date {
            color: #1f2937;
        }

        .title-diff {
            color: #10b981;
        }

        .tagline {
            font-size: 18px;
            color: #6b7280;
        }

        .main-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .card {
            background: white;
            border-radius: 16px;
            border: 2px solid #d1fae5;
            padding: 40px;
            flex: 1;
        }

        .input-card {
            position: relative;
        }

        .calendar-toggle-container {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calendar-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #10b981;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        input:not(:checked) + .slider {
            background-color: #d1d5db;
        }

        .input-group {
            margin-bottom: 30px;
            margin-top: 60px;
        }

        .input-group:first-of-type {
            margin-top: 0;
        }

        label {
            display: block;
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .date-input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #10b981;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            background: #059669;
        }

        .calculate-btn:active {
            transform: scale(0.98);
        }

        .results-card {
            position: relative;
        }

        .result-item {
            margin-bottom: 30px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 16px;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 48px;
            font-weight: 700;
            color: #1f2937;
        }

        .result-value.weekdays {
            color: #10b981;
        }

        .holidays-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
        }

        .holidays-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .holidays-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
        }

        .country-holidays {
            margin-bottom: 25px;
        }

        .country-holidays:last-child {
            margin-bottom: 0;
        }

        .country-flag {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .holiday-item {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 4px;
            line-height: 1.6;
        }

        .holiday-date {
            font-weight: 500;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .main-title {
                font-size: 56px;
            }
        }

        @media (max-width: 768px) {
            .header {
                position: static;
                margin-bottom: 30px;
                text-align: center;
            }

            .container {
                padding-top: 20px;
            }

            .main-title {
                font-size: 48px;
            }

            .card {
                padding: 30px 20px;
            }

            .calendar-toggle-container {
                position: static;
                justify-content: flex-end;
                margin-bottom: 20px;
            }

            .input-group {
                margin-top: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-brand">NEERJAX</span> / <span class="header-app">DATEDIFF</span>
    </div>

    <div class="container">
        <div class="title-section">
            <h1 class="main-title">
                <span class="title-date">Date</span><span class="title-diff">Diff</span>
            </h1>
            <p class="tagline">Your friendly date for all your date-diff needs</p>
        </div>

        <div class="main-container">
            <div class="card input-card">
                <div class="calendar-toggle-container">
                    <span class="calendar-label">Calendar</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="calendarToggle" onchange="toggleCalendar()" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="input-group">
                    <label for="startDate">Start Date</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="startDate" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="endDate">End Date</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="endDate" required>
                    </div>
                </div>

                <button class="calculate-btn" onclick="calculateDifference()">Calculate Difference</button>

                <div class="error" id="error"></div>
            </div>

            <div class="card results-card" id="results">
                <div class="result-item">
                    <div class="result-label">Total Days</div>
                    <div class="result-value" id="totalDays">97</div>
                </div>

                <div class="result-item">
                    <div class="result-label">Weekdays</div>
                    <div class="result-value weekdays" id="weekdays">92</div>
                </div>

                <div class="result-item">
                    <div class="result-label">Weekends</div>
                    <div class="result-value" id="weekend">13</div>
                </div>

                <div class="holidays-section">
                    <div class="holidays-title">Holidays</div>
                    <div class="holidays-box" id="holidaysBox">
                        <div class="country-holidays">
                            <div class="country-flag">🇮🇳</div>
                            <div class="holiday-item">• <span class="holiday-date">10-Jul-2025</span> / Diwali</div>
                            <div class="holiday-item">• <span class="holiday-date">12-Jul-2025</span> / Dussehra</div>
                        </div>
                        <div class="country-holidays">
                            <div class="country-flag">🇺🇸</div>
                            <div class="holiday-item">• <span class="holiday-date">4-Jul-2025</span> / 4th of July</div>
                            <div class="holiday-item">• <span class="holiday-date">12-Jul-2025</span> / Halloween</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Holiday data for different countries
        const holidays = {
            india: [
                { date: '2025-01-26', name: 'Republic Day' },
                { date: '2025-03-14', name: 'Holi' },
                { date: '2025-08-15', name: 'Independence Day' },
                { date: '2025-10-02', name: 'Gandhi Jayanti' },
                { date: '2025-10-20', name: 'Dussehra' },
                { date: '2025-11-08', name: 'Diwali' }
            ],
            usa: [
                { date: '2025-01-01', name: 'New Year\'s Day' },
                { date: '2025-07-04', name: '4th of July' },
                { date: '2025-10-31', name: 'Halloween' },
                { date: '2025-11-27', name: 'Thanksgiving' },
                { date: '2025-12-25', name: 'Christmas' }
            ]
        };

        function toggleCalendar() {
            const toggle = document.getElementById('calendarToggle');
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');

            if (toggle.checked) {
                // Switch to calendar mode
                const startValue = startDateInput.value;
                const endValue = endDateInput.value;

                let startDateValue = '';
                let endDateValue = '';

                if (startValue && startDateInput.type === 'text') {
                    const startDate = parseDate(startValue);
                    if (startDate && !isNaN(startDate.getTime())) {
                        startDateValue = formatDateForInput(startDate);
                    }
                } else if (startValue && startDateInput.type === 'date') {
                    startDateValue = startValue;
                }

                if (endValue && endDateInput.type === 'text') {
                    const endDate = parseDate(endValue);
                    if (endDate && !isNaN(endDate.getTime())) {
                        endDateValue = formatDateForInput(endDate);
                    }
                } else if (endValue && endDateInput.type === 'date') {
                    endDateValue = endValue;
                }

                startDateInput.type = 'date';
                endDateInput.type = 'date';
                setTimeout(() => {
                    startDateInput.value = startDateValue;
                    endDateInput.value = endDateValue;
                }, 0);
            } else {
                // Switch to text mode
                const startValue = startDateInput.value;
                const endValue = endDateInput.value;

                let startTextValue = '';
                let endTextValue = '';

                if (startValue && startDateInput.type === 'date') {
                    const startDate = new Date(startValue + 'T00:00:00');
                    if (!isNaN(startDate.getTime())) {
                        startTextValue = formatDateToText(startDate);
                    }
                } else if (startValue && startDateInput.type === 'text') {
                    startTextValue = startValue;
                }

                if (endValue && endDateInput.type === 'date') {
                    const endDate = new Date(endValue + 'T00:00:00');
                    if (!isNaN(endDate.getTime())) {
                        endTextValue = formatDateToText(endDate);
                    }
                } else if (endValue && endDateInput.type === 'text') {
                    endTextValue = endValue;
                }

                startDateInput.type = 'text';
                endDateInput.type = 'text';
                startDateInput.placeholder = 'dd-mmm-yyy';
                endDateInput.placeholder = 'dd-mmm-yyy';
                setTimeout(() => {
                    startDateInput.value = startTextValue;
                    endDateInput.value = endTextValue;
                }, 0);
            }
        }

        function formatDateForInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateToText(date) {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(date.getDate()).padStart(2, '0');
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function formatDateForDisplay(date) {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = date.getDate();
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function parseDate(dateStr) {
            dateStr = dateStr.trim();

            const months = {
                'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
                'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
            };

            const ddMmmYyyyMatch = dateStr.match(/^(\d{1,2})-([a-zA-Z]{3})-(\d{4})$/);
            if (ddMmmYyyyMatch) {
                const day = parseInt(ddMmmYyyyMatch[1]);
                const monthStr = ddMmmYyyyMatch[2].toLowerCase();
                const year = parseInt(ddMmmYyyyMatch[3]);

                if (months.hasOwnProperty(monthStr)) {
                    const month = months[monthStr];
                    const date = new Date(year, month, day);
                    if (date.getDate() === day && date.getMonth() === month && date.getFullYear() === year) {
                        return date;
                    }
                }
            }

            return null;
        }

        function getHolidaysInRange(startDate, endDate) {
            const holidaysInRange = {
                india: [],
                usa: []
            };

            // Check India holidays
            holidays.india.forEach(holiday => {
                const holidayDate = new Date(holiday.date + 'T00:00:00');
                if (holidayDate >= startDate && holidayDate <= endDate) {
                    holidaysInRange.india.push({
                        date: formatDateForDisplay(holidayDate),
                        name: holiday.name
                    });
                }
            });

            // Check USA holidays
            holidays.usa.forEach(holiday => {
                const holidayDate = new Date(holiday.date + 'T00:00:00');
                if (holidayDate >= startDate && holidayDate <= endDate) {
                    holidaysInRange.usa.push({
                        date: formatDateForDisplay(holidayDate),
                        name: holiday.name
                    });
                }
            });

            return holidaysInRange;
        }

        function displayHolidays(holidaysInRange) {
            const holidaysBox = document.getElementById('holidaysBox');
            let html = '';

            if (holidaysInRange.india.length > 0) {
                html += '<div class="country-holidays">';
                html += '<div class="country-flag">🇮🇳</div>';
                holidaysInRange.india.forEach(holiday => {
                    html += `<div class="holiday-item">• <span class="holiday-date">${holiday.date}</span> / ${holiday.name}</div>`;
                });
                html += '</div>';
            }

            if (holidaysInRange.usa.length > 0) {
                html += '<div class="country-holidays">';
                html += '<div class="country-flag">🇺🇸</div>';
                holidaysInRange.usa.forEach(holiday => {
                    html += `<div class="holiday-item">• <span class="holiday-date">${holiday.date}</span> / ${holiday.name}</div>`;
                });
                html += '</div>';
            }

            if (html === '') {
                html = '<div style="color: #9ca3af; text-align: center; padding: 20px;">No holidays found in this date range</div>';
            }

            holidaysBox.innerHTML = html;
        }

        function calculateDifference() {
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');
            const errorDiv = document.getElementById('error');
            const isCalendarMode = document.getElementById('calendarToggle').checked;

            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            if (!startDateInput.value || !endDateInput.value) {
                errorDiv.textContent = 'Please enter both dates';
                errorDiv.classList.add('show');
                return;
            }

            let startDate, endDate;

            if (isCalendarMode) {
                startDate = new Date(startDateInput.value + 'T00:00:00');
                endDate = new Date(endDateInput.value + 'T00:00:00');
            } else {
                startDate = parseDate(startDateInput.value);
                endDate = parseDate(endDateInput.value);
            }

            if (!startDate || isNaN(startDate.getTime())) {
                errorDiv.textContent = isCalendarMode ? 'Invalid start date' : 'Invalid start date. Use format dd-mmm-yyy';
                errorDiv.classList.add('show');
                return;
            }

            if (!endDate || isNaN(endDate.getTime())) {
                errorDiv.textContent = isCalendarMode ? 'Invalid end date' : 'Invalid end date. Use format dd-mmm-yyy';
                errorDiv.classList.add('show');
                return;
            }

            if (endDate < startDate) {
                errorDiv.textContent = 'End date must be after start date';
                errorDiv.classList.add('show');
                return;
            }

            // Calculate differences
            let totalDays = 0;
            let weekdays = 0;
            let weekend = 0;

            const currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                totalDays++;
                const dayOfWeek = currentDate.getDay();

                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    weekend++;
                } else {
                    weekdays++;
                }

                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Display results
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('weekdays').textContent = weekdays;
            document.getElementById('weekend').textContent = weekend;

            // Get and display holidays
            const holidaysInRange = getHolidaysInRange(startDate, endDate);
            displayHolidays(holidaysInRange);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set default dates for the example
            const today = new Date();
            document.getElementById('startDate').value = formatDateForInput(today);

            const futureDate = new Date(today);
            futureDate.setDate(today.getDate() + 96); // 97 days total (including start date)
            document.getElementById('endDate').value = formatDateForInput(futureDate);

            // Calculate initial results
            calculateDifference();
        });

        // Allow Enter key to trigger calculation
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateDifference();
            }
        });
    </script>
</body>
</html>
