<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            transition: transform 0.2s;
        }

        .result-row:hover {
            transform: translateX(5px);
        }

        .result-row.total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .result-row.weekdays {
            background: #e3f2fd;
            color: #1976d2;
        }

        .result-row.weekend {
            background: #fce4ec;
            color: #c2185b;
        }

        .result-label {
            font-weight: 600;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Date Difference Calculator</h1>

        <div class="input-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" required>
        </div>

        <div class="input-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" required>
        </div>

        <button class="button" onclick="calculateDifference()">Calculate Difference</button>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="result-row total">
                <span class="result-label">Total Days</span>
                <span class="result-value" id="totalDays">0</span>
            </div>
            <div class="result-row weekdays">
                <span class="result-label">Weekdays (Mon-Fri)</span>
                <span class="result-value" id="weekdays">0</span>
            </div>
            <div class="result-row weekend">
                <span class="result-label">Weekend (Sat-Sun)</span>
                <span class="result-value" id="weekend">0</span>
            </div>
        </div>
    </div>

    <script>
        function calculateDifference() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            // Reset error
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            // Validate inputs
            if (!startDateInput || !endDateInput) {
                errorDiv.textContent = 'Please select both dates';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            const startDate = new Date(startDateInput);
            const endDate = new Date(endDateInput);

            // Validate date order
            if (endDate < startDate) {
                errorDiv.textContent = 'End date must be after start date';
                errorDiv.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            // Calculate differences
            let totalDays = 0;
            let weekdays = 0;
            let weekend = 0;

            // Iterate through each day
            const currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                totalDays++;
                const dayOfWeek = currentDate.getDay();

                // 0 = Sunday, 6 = Saturday
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    weekend++;
                } else {
                    weekdays++;
                }

                // Move to next day
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Display results
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('weekdays').textContent = weekdays;
            document.getElementById('weekend').textContent = weekend;
            resultsDiv.classList.add('show');
        }

        // Set today's date as default for start date
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
        });

        // Allow Enter key to trigger calculation
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateDifference();
            }
        });
    </script>
</body>
</html>
