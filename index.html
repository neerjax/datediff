<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateDiff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f1f3;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            position: absolute;
            top: 40px;
            left: 55px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-brand {
            color: #000;
        }

        .header-separator {
            color: #000;
            margin: 0 8px;
        }

        .header-app {
            color: #10b981;
            text-transform: uppercase;
            font-style: italic;
        }

        /* Main Container */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding-top: 40px;
        }

        /* Title Section */
        .title-section {
            text-align: center;
            margin-bottom: 80px;
        }

        .main-title {
            font-size: 80px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 15px;
        }

        .title-date {
            color: #1f2937;
        }

        .title-diff {
            color: #10b981;
        }

        .tagline {
            font-size: 20px;
            color: #6b7280;
            font-weight: 400;
        }

        /* Cards Container */
        .cards-container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 2px solid #d1fae5;
            border-radius: 20px;
            padding: 35px 40px;
            flex: 1;
            position: relative;
        }

        /* Left Card - Input */
        .input-card {
            max-width: 480px;
        }

        .calendar-toggle {
            position: static;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
        }

        .calendar-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #10b981;
            transition: 0.3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        input:not(:checked) + .slider {
            background-color: #d1d5db;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-input-wrapper input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-family: inherit;
            color: #6b7280;
            transition: border-color 0.2s;
        }

        .date-input-wrapper input:focus {
            outline: none;
            border-color: #10b981;
        }

        .date-input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .calendar-icon {
            position: absolute;
            right: 12px;
            pointer-events: none;
            color: #9ca3af;
            font-size: 18px;
        }

        /* Button */
        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            background: #059669;
        }

        .calculate-btn:active {
            transform: scale(0.98);
        }

        /* Right Card - Results */
        .results-card {
            max-width: 550px;
        }

        .result-group {
            margin-bottom: 40px;
        }

        .result-label {
            font-size: 16px;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 56px;
            font-weight: 700;
            color: #1f2937;
            line-height: 1;
        }

        .result-value.green {
            color: #10b981;
        }

        /* Holidays Section */
        .holidays-section {
            margin-top: 45px;
            padding-top: 35px;
            border-top: 1px solid #e5e7eb;
        }

        .holidays-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .holidays-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }

        .holidays-subtitle {
            font-size: 12px;
            color: #9ca3af;
        }

        .holidays-box {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 24px;
            background: #fafafa;
            min-height: 180px;
        }

        .country-section {
            margin-bottom: 28px;
        }

        .country-section:last-child {
            margin-bottom: 0;
        }

        .country-flag {
            font-size: 26px;
            margin-bottom: 12px;
            line-height: 1;
        }

        .holiday-item {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.8;
            margin-bottom: 2px;
        }

        .holiday-date {
            font-weight: 500;
        }

        .holiday-legend {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 12px;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .cards-container {
                flex-direction: column;
                align-items: stretch;
                gap: 25px;
            }

            .card {
                max-width: 100%;
                width: 100%;
            }

            .input-card {
                max-width: 100%;
            }

            .results-card {
                max-width: 100%;
            }

            .main-title {
                font-size: 64px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .header {
                position: static;
                text-align: center;
                margin-bottom: 20px;
                font-size: 14px;
            }

            .container {
                padding-top: 10px;
            }

            .main-title {
                font-size: 42px;
            }

            .title-section {
                margin-bottom: 35px;
            }

            .tagline {
                font-size: 16px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 16px;
            }

            .calendar-toggle {
                position: static;
                flex-direction: row;
                justify-content: flex-end;
                align-items: center;
                margin-bottom: 25px;
                gap: 10px;
            }

            .cards-container {
                gap: 20px;
            }

            .result-group {
                margin-bottom: 30px;
            }

            .result-value {
                font-size: 48px;
            }

            .holidays-box {
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .header {
                font-size: 12px;
            }

            .main-title {
                font-size: 36px;
            }

            .tagline {
                font-size: 14px;
            }

            .card {
                padding: 20px 15px;
            }

            .result-value {
                font-size: 40px;
            }

            .holidays-section {
                margin-top: 30px;
                padding-top: 25px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <span class="header-brand">NEERJAX</span><span class="header-separator">/</span><span class="header-app">DATE DIFF</span>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Title -->
        <div class="title-section">
            <h1 class="main-title">
                <span class="title-date">Date</span><span class="title-diff">Diff</span>
            </h1>
            <p class="tagline">Your friendly date for all your date-diff needs</p>
        </div>

        <!-- Cards -->
        <div class="cards-container">
            <!-- Left Card - Input -->
            <div class="card input-card">
                <!-- Calendar Toggle -->
                <div class="calendar-toggle">
                    <span class="calendar-label">Calendar</span>
                    <label class="switch">
                        <input type="checkbox" id="calendarToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Start Date -->
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <div class="date-input-wrapper">
                        <input type="text" id="startDate" placeholder="dd-mmm-yyy">
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <!-- End Date -->
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <div class="date-input-wrapper">
                        <input type="text" id="endDate" placeholder="dd-mmm-yyy">
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <!-- Calculate Button -->
                <button class="calculate-btn" onclick="calculateDifference()">Calculate Difference</button>
            </div>

            <!-- Right Card - Results -->
            <div class="card results-card">
                <!-- Total Days -->
                <div class="result-group">
                    <div class="result-label">Total Days</div>
                    <div class="result-value" id="totalDays">97</div>
                </div>

                <!-- Weekdays -->
                <div class="result-group">
                    <div class="result-label">Weekdays</div>
                    <div class="result-value green" id="weekdays">92</div>
                </div>

                <!-- Weekends -->
                <div class="result-group">
                    <div class="result-label">Weekends</div>
                    <div class="result-value" id="weekends">13</div>
                </div>

                <!-- Holidays -->
                <div class="holidays-section">
                    <div class="holidays-header">
                        <div class="holidays-title">Holidays</div>
                        <div class="holidays-subtitle">• 2 countries</div>
                    </div>
                    <div class="holidays-box" id="holidaysBox">
                        <div class="country-section">
                            <div class="country-flag">🇮🇳</div>
                            <div class="holiday-item">• <span class="holiday-date">10-Jul-2025</span> / Diwali</div>
                            <div class="holiday-item">• <span class="holiday-date">12-Jul-2025</span> / Dussehra</div>
                        </div>
                        <div class="country-section">
                            <div class="country-flag">🇺🇸</div>
                            <div class="holiday-item">• <span class="holiday-date">4-Jul-2025</span> / 4th of July</div>
                            <div class="holiday-item">• <span class="holiday-date">12-Jul-2025</span> / Halloween</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Comprehensive holiday data for India and USA (2025-2026)
        const holidays = {
            india: [
                // 2025 holidays
                { date: '2025-01-01', name: 'New Year\'s Day' },
                { date: '2025-01-26', name: 'Republic Day' },
                { date: '2025-03-14', name: 'Holi' },
                { date: '2025-03-30', name: 'Ram Navami' },
                { date: '2025-04-10', name: 'Mahavir Jayanti' },
                { date: '2025-04-14', name: 'Ambedkar Jayanti' },
                { date: '2025-04-18', name: 'Good Friday' },
                { date: '2025-05-12', name: 'Buddha Purnima' },
                { date: '2025-08-15', name: 'Independence Day' },
                { date: '2025-08-27', name: 'Janmashtami' },
                { date: '2025-10-02', name: 'Gandhi Jayanti' },
                { date: '2025-10-02', name: 'Dussehra' },
                { date: '2025-10-20', name: 'Diwali' },
                { date: '2025-11-05', name: 'Guru Nanak Jayanti' },
                { date: '2025-12-25', name: 'Christmas' },
                // 2026 holidays
                { date: '2026-01-01', name: 'New Year\'s Day' },
                { date: '2026-01-26', name: 'Republic Day' },
                { date: '2026-03-03', name: 'Holi' },
                { date: '2026-03-19', name: 'Ram Navami' },
                { date: '2026-04-03', name: 'Good Friday' },
                { date: '2026-04-06', name: 'Mahavir Jayanti' },
                { date: '2026-04-14', name: 'Ambedkar Jayanti' },
                { date: '2026-05-01', name: 'Buddha Purnima' },
                { date: '2026-08-15', name: 'Independence Day' },
                { date: '2026-08-16', name: 'Janmashtami' },
                { date: '2026-10-02', name: 'Gandhi Jayanti' },
                { date: '2026-10-11', name: 'Dussehra' },
                { date: '2026-10-29', name: 'Diwali' },
                { date: '2026-11-24', name: 'Guru Nanak Jayanti' },
                { date: '2026-12-25', name: 'Christmas' }
            ],
            usa: [
                // 2025 holidays
                { date: '2025-01-01', name: 'New Year\'s Day' },
                { date: '2025-01-20', name: 'Martin Luther King Jr. Day' },
                { date: '2025-02-17', name: 'Presidents\' Day' },
                { date: '2025-05-26', name: 'Memorial Day' },
                { date: '2025-06-19', name: 'Juneteenth' },
                { date: '2025-07-04', name: 'Independence Day' },
                { date: '2025-09-01', name: 'Labor Day' },
                { date: '2025-10-13', name: 'Columbus Day' },
                { date: '2025-10-31', name: 'Halloween' },
                { date: '2025-11-11', name: 'Veterans Day' },
                { date: '2025-11-27', name: 'Thanksgiving' },
                { date: '2025-12-25', name: 'Christmas Day' },
                // 2026 holidays
                { date: '2026-01-01', name: 'New Year\'s Day' },
                { date: '2026-01-19', name: 'Martin Luther King Jr. Day' },
                { date: '2026-02-16', name: 'Presidents\' Day' },
                { date: '2026-05-25', name: 'Memorial Day' },
                { date: '2026-06-19', name: 'Juneteenth' },
                { date: '2026-07-04', name: 'Independence Day' },
                { date: '2026-09-07', name: 'Labor Day' },
                { date: '2026-10-12', name: 'Columbus Day' },
                { date: '2026-10-31', name: 'Halloween' },
                { date: '2026-11-11', name: 'Veterans Day' },
                { date: '2026-11-26', name: 'Thanksgiving' },
                { date: '2026-12-25', name: 'Christmas Day' }
            ]
        };

        // Toggle calendar functionality
        document.getElementById('calendarToggle').addEventListener('change', function() {
            const startDate = document.getElementById('startDate');
            const endDate = document.getElementById('endDate');

            if (this.checked) {
                // Switch to date picker
                startDate.type = 'date';
                endDate.type = 'date';
                document.querySelectorAll('.calendar-icon').forEach(icon => {
                    icon.style.display = 'none';
                });
            } else {
                // Switch to text input
                startDate.type = 'text';
                endDate.type = 'text';
                startDate.placeholder = 'dd-mmm-yyy';
                endDate.placeholder = 'dd-mmm-yyy';
                document.querySelectorAll('.calendar-icon').forEach(icon => {
                    // Hide icons when calendar toggle is off
                    icon.style.display = 'none';
                });
            }
        });

        function parseDate(dateStr) {
            const months = {
                'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
                'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
            };

            const match = dateStr.match(/^(\d{1,2})-([a-zA-Z]{3})-(\d{4})$/i);
            if (match) {
                const day = parseInt(match[1]);
                const month = months[match[2].toLowerCase()];
                const year = parseInt(match[3]);
                return new Date(year, month, day);
            }
            return null;
        }

        function formatDateDisplay(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function calculateDifference() {
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;
            const isCalendarMode = document.getElementById('calendarToggle').checked;

            if (!startInput || !endInput) {
                alert('Please enter both dates');
                return;
            }

            let startDate, endDate;

            if (isCalendarMode) {
                startDate = new Date(startInput);
                endDate = new Date(endInput);
            } else {
                startDate = parseDate(startInput);
                endDate = parseDate(endInput);
            }

            if (!startDate || !endDate || isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
                alert('Invalid date format. Use dd-mmm-yyy');
                return;
            }

            if (endDate < startDate) {
                alert('End date must be after start date');
                return;
            }

            // Calculate days
            let totalDays = 0;
            let weekdays = 0;
            let weekends = 0;

            const current = new Date(startDate);
            while (current <= endDate) {
                totalDays++;
                const day = current.getDay();
                if (day === 0 || day === 6) {
                    weekends++;
                } else {
                    weekdays++;
                }
                current.setDate(current.getDate() + 1);
            }

            // Update results
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('weekdays').textContent = weekdays;
            document.getElementById('weekends').textContent = weekends;

            // Update holidays
            updateHolidays(startDate, endDate);
        }

        function updateHolidays(startDate, endDate) {
            const holidaysBox = document.getElementById('holidaysBox');
            let html = '';
            let countryCount = 0;
            let hasWeekdayHoliday = false;

            // Helper function to check if date is a weekday
            function isWeekday(date) {
                const day = date.getDay();
                return day >= 1 && day <= 5; // Monday (1) to Friday (5)
            }

            // India holidays
            const indiaHolidays = holidays.india.filter(h => {
                const hDate = new Date(h.date);
                return hDate >= startDate && hDate <= endDate;
            });

            if (indiaHolidays.length > 0) {
                countryCount++;
                html += '<div class="country-section"><div class="country-flag">🇮🇳</div>';
                indiaHolidays.forEach(h => {
                    const hDate = new Date(h.date);
                    const weekday = isWeekday(hDate);
                    if (weekday) hasWeekdayHoliday = true;
                    const asterisk = weekday ? '*' : '';
                    html += `<div class="holiday-item">• <span class="holiday-date">${formatDateDisplay(hDate)}${asterisk}</span> / ${h.name}</div>`;
                });
                html += '</div>';
            }

            // USA holidays
            const usaHolidays = holidays.usa.filter(h => {
                const hDate = new Date(h.date);
                return hDate >= startDate && hDate <= endDate;
            });

            if (usaHolidays.length > 0) {
                countryCount++;
                html += '<div class="country-section"><div class="country-flag">🇺🇸</div>';
                usaHolidays.forEach(h => {
                    const hDate = new Date(h.date);
                    const weekday = isWeekday(hDate);
                    if (weekday) hasWeekdayHoliday = true;
                    const asterisk = weekday ? '*' : '';
                    html += `<div class="holiday-item">• <span class="holiday-date">${formatDateDisplay(hDate)}${asterisk}</span> / ${h.name}</div>`;
                });
                html += '</div>';
            }

            // Add legend if there are weekday holidays
            if (hasWeekdayHoliday && html !== '') {
                html += '<div class="holiday-legend">* Falls on a weekday</div>';
            }

            if (html === '') {
                html = '<div style="text-align: center; color: #9ca3af; padding: 20px;">No holidays in this date range</div>';
                countryCount = 0;
            }

            holidaysBox.innerHTML = html;
            document.querySelector('.holidays-subtitle').textContent = `• ${countryCount} ${countryCount === 1 ? 'country' : 'countries'}`;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', function() {
            // Hide calendar icons for date input
            document.querySelectorAll('.calendar-icon').forEach(icon => {
                icon.style.display = 'none';
            });

            // Set input type to date
            document.getElementById('startDate').type = 'date';
            document.getElementById('endDate').type = 'date';

            // Set initial display to zeros and empty holidays
            document.getElementById('totalDays').textContent = '0';
            document.getElementById('weekdays').textContent = '0';
            document.getElementById('weekends').textContent = '0';
            document.getElementById('holidaysBox').innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 20px;">No holidays found in this date range</div>';
            document.querySelector('.holidays-subtitle').textContent = '• 0 countries';
        });

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateDifference();
            }
        });
    </script>
</body>
</html>
